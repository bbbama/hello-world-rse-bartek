[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hello-world-rse-bartek"
version = "0.1.3"
authors = [{ name="bbbama", email="bartamalio@gmail.com" }]
description = "RSE Assignment - simple use of Pint"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
dependencies = ["pint>=0.21,<0.24"]

[project.urls]
Repository = "https://github.com/bbbama/hello-world-rse-bartek"

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "mkdocs-material"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
